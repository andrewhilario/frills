<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">{{{robots}}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Frills">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Frills: free chat overlays with all the frills, shown as a cute chat box on a dark stage.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="{{themeColor}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{css}}">
{{{jsonld}}}
</head>
<body class="{{bodyClass}}" data-waitlist="{{waitlist}}" data-relay="{{relay}}" data-site="{{siteAddress}}">
<a class="skip" href="#main">Skip to content</a>
{{{chrome}}}
{{{content}}}
{{{footer}}}
<script src="{{js}}" defer></script>
</body>
</html>
