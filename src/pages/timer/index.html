  "description": "A countdown timer for your TikTok LIVE that grows when viewers send gifts. Choose how many seconds each gift adds, start it with a button, copy one link. Free.",
  "path": "/timer/",
  "updated": "2026-11-01",
  "published": "2026-11-01",
  "css": "widget",
  "js": "timer",
  "bodyClass": "page-editor page-alerts",

  "footer": false,
  "intro": "intro-timer",

}
-->
<main class="workspace" id="main">
  <section class="preview" id="preview" data-back="dark" aria-label="Live preview of your subathon timer">
    <div class="preview__bar">
      <span class="preview__tag">Preview</span>
      <label class="visually-hidden" for="backdrop">What sits behind the overlay</label>
      <select id="backdrop">
        <option value="dark">Dark game</option>
        <option value="bright">Bright game</option>
        <option value="busy">Busy scene</option>
        <option value="checker">See-through</option>
      </select>
    </div>
    <div class="chatstage" id="stage" aria-hidden="true"><div id="widget"></div></div>
    <div class="preview__tests" role="group" aria-label="Controls and tests">
      <button class="btn btn--sm" type="button" data-test="start">Start</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="pause">Pause</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="resume">Resume</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="minute">+1 min</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="five">+5 min</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="less">−1 min</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="reset">Reset</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="gift">Try a gift</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="follow">Try a follow</button>
    </div>
    <p class="ctl__hint" id="timer-sent" role="status"></p>
  </section>

  <div class="panel">
    <noscript><p class="note">Frills needs JavaScript to draw your overlay. Turn it on for this page and reload.</p></noscript>
    {{{intro}}}

    <section class="step-card" aria-labelledby="s1">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">1</span>
        <h2 class="step-card__title" id="s1">Pick a look</h2>
        <button class="btn btn--soft btn--sm step-card__aside" type="button" id="reset">Reset</button>
      </div>
      <div class="chips" id="looks" role="group" aria-label="Starting looks"></div>
      <div class="stack" id="look-controls"></div>
    </section>

    <section class="step-card" aria-labelledby="s2">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">2</span>
        <h2 class="step-card__title" id="s2">Time and rules</h2>
      </div>
      <div class="stack" id="opt-controls"></div>
    </section>

    <section class="step-card" aria-labelledby="s3">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">3</span>
        <h2 class="step-card__title" id="s3">Connect your TikTok</h2>
      </div>
      <div id="source"></div>
      <p class="ctl__hint" id="relay-note" role="status"></p>
    </section>

    <section class="step-card" aria-labelledby="s4">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">4</span>
        <h2 class="step-card__title" id="s4">Add it to your stream</h2>
      </div>
      <div class="linkfield">
        <label class="ctl__label" for="link">Your link</label>
        <input type="text" id="link" readonly placeholder="Appears once you type a name" spellcheck="false" autocomplete="off">
        <div class="linkfield__actions">
          <button class="btn" type="button" id="copy-link" disabled>Copy link</button>
        </div>
        <p class="linkfield__hint" id="link-hint" role="status"></p>
      </div>
    </section>

    {{{about}}}

    <section class="preview-tools" aria-label="Preview options">
      <div id="preview-canvas"></div>
    </section>
  </div>
</main>
