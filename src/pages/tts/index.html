<!--
{
  "title": "Talking Pet TTS for TikTok LIVE alerts & chat | Frills",
  "description": "An animated pet reads TikTok LIVE gifts and !say chat messages aloud with speech bubbles and browser or Pro AI voices. Test on any live stream locally or in OBS.",
  "path": "/tts/",
  "updated": "2026-11-11",
  "published": "2026-11-11",
  "css": "widget",
  "js": "tts",
  "bodyClass": "page-editor page-alerts",
  "chrome": "appbar",
  "footer": false,
  "intro": "intro-tts",
  "about": "about-tts",
  "jsonld": ["webapp"]
}
-->
<main class="workspace" id="main">
  <section class="preview" id="preview" data-back="dark" aria-label="Live preview of Talking Pet TTS">
    <div class="preview__bar">
      <span class="preview__tag">Preview</span>
      <label class="visually-hidden" for="backdrop">What sits behind the overlay</label>
      <select id="backdrop">
        <option value="dark">Dark game</option>
        <option value="bright">Bright game</option>
        <option value="busy">Busy scene</option>
        <option value="checker">See-through</option>
      </select>
    </div>
    <div class="chatstage" id="stage" aria-hidden="true"><div id="widget"></div></div>
    <div class="preview__tests" role="group" aria-label="Test voices and events">
      <button class="btn btn--soft btn--sm" type="button" data-test="gift">Gift thank-you</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="bigGift">Big gift</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="cmd">Say !say line</button>
      <button class="btn btn--soft btn--sm" type="button" data-test="clear">Stop &amp; clear</button>
      <form class="tts-saybox" id="say-form">
        <label class="visually-hidden" for="say-input">Custom test message</label>
        <input type="text" id="say-input" maxlength="200" placeholder="Type any line for your pet to say…">
        <button class="btn btn--soft btn--sm" type="submit">Say line</button>
      </form>
    </div>
  </section>

  <div class="panel">
    <noscript><p class="note">Frills needs JavaScript to run the voice editor. Turn it on for this page and reload.</p></noscript>
    {{{intro}}}

    <div class="pro-status" id="pro-status" role="status" hidden></div>

    <aside class="pro-paywall" id="pro-paywall" hidden>
      <p class="pro-paywall__title" id="pro-paywall-title">Frills Pro required for AI voices</p>
      <p class="pro-paywall__body" id="pro-paywall-body"></p>
      <div class="pro-paywall__actions">
        <button class="btn btn--sm" type="button" id="pro-checkout" hidden>Buy Frills Pro Pass</button>
      </div>
      <form class="pro-paywall__form" id="ls-form">
        <label class="visually-hidden" for="ls-key">Lemon Squeezy license key</label>
        <input type="text" id="ls-key" maxlength="160" placeholder="Paste Lemon Squeezy license key to activate…" autocomplete="off" spellcheck="false">
        <button class="btn btn--soft btn--sm" type="submit" id="ls-activate">Activate key</button>
      </form>
    </aside>

    <section class="pro-tester" id="pro-tester" aria-label="Local paywall and region simulator" hidden>
      <div class="pro-tester__row">
        <label class="ctl__label" for="sim-country">Simulate visitor region (dev only)</label>
        <select id="sim-country">
          <option value="">Local dev bypass</option>
          <option value="US">US — Tier-1 eligible (paywall active)</option>
          <option value="DE">DE — EU eligible (paywall active)</option>
          <option value="GB">GB — UK eligible (paywall active)</option>
          <option value="PH">PH — Region locked</option>
          <option value="BR">BR — Region locked</option>
        </select>
      </div>
      <div class="pro-tester__row">
        <button class="btn btn--soft btn--sm" type="button" id="mint-pass">Create 5-credit test Pro Pass</button>
        <button class="btn btn--soft btn--sm" type="button" id="clear-pass">Clear pass key</button>
        <button class="btn btn--soft btn--sm" type="button" id="check-pass">Refresh pass status</button>
      </div>
    </section>

    <section class="step-card" aria-labelledby="s1">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">1</span>
        <h2 class="step-card__title" id="s1">Pick a look</h2>
        <button class="btn btn--soft btn--sm step-card__aside" type="button" id="reset">Reset</button>
      </div>
      <div class="chips" id="looks" role="group" aria-label="Starting looks"></div>
      <div class="stack" id="look-controls"></div>
    </section>

    <section class="step-card" aria-labelledby="s2">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">2</span>
        <h2 class="step-card__title" id="s2">Pet, voice &amp; triggers</h2>
      </div>
      <div class="ctl" id="browser-voice-row" hidden>
        <label class="ctl__label" for="browser-voice-pick">Installed browser voices</label>
        <select id="browser-voice-pick">
          <option value="">Auto (match voice style)</option>
        </select>
        <p class="ctl__hint">Lists free voices exposed by your current browser (Microsoft Edge offers free Online Natural voices).</p>
      </div>
      <div class="stack" id="opt-controls"></div>
    </section>

    <section class="step-card" aria-labelledby="s3">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">3</span>
        <h2 class="step-card__title" id="s3">Connect a TikTok LIVE</h2>
      </div>
      <div id="source"></div>
      <p class="ctl__hint" id="relay-note" role="status"></p>
    </section>

    <section class="step-card" aria-labelledby="s4">
      <div class="step-card__head">
        <span class="step-card__num" aria-hidden="true">4</span>
        <h2 class="step-card__title" id="s4">Add it to your stream</h2>
      </div>
      <div class="linkfield">
        <label class="ctl__label" for="link">Your link</label>
        <input type="text" id="link" readonly placeholder="Appears once you type a TikTok name" spellcheck="false" autocomplete="off">
        <div class="linkfield__actions">
          <button class="btn" type="button" id="copy-link" disabled>Copy link</button>
        </div>
        <p class="linkfield__hint" id="link-hint" role="status"></p>
      </div>
    </section>

    {{{about}}}

    <section class="preview-tools" aria-label="Preview options">
      <div id="preview-canvas"></div>
    </section>
  </div>
</main>
